[project]
name = "kafka-practice"
version = "0.1.0"
description = "Учебный PostgreSQL CDC стенд с Debezium"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.16,<1",
    "confluent-kafka>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
]

[project.scripts]
kafka-practice = "kafka_practice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kafka_practice"]
